name: Publish TokenPay container image

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile.railway
      - global.json
      - src/TokenPay/**
      - .github/workflows/publish-tokenpay-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.railway
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/cnmbdb/tokenpay:latest
            ghcr.io/cnmbdb/tokenpay:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/cnmbdb/TokenPay
            org.opencontainers.image.revision=${{ github.sha }}